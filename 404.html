<!doctype html>
<html lang="en">

<title>Page not found · Lumi and the Magical World</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&display=swap">
<style>
  :root { --bg:#f7f2ff; --paper:#fff; --ink:#3a2763; --muted:#7b6b9c; --pink:#ff9ad5; --sun:#ffd45e; --sky:#8ad9f7; --lav:#c6a6f7; --gold:#f0b437; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1a1538; --paper:#272058; --ink:#f6f1ff; --muted:#bdb2e3; --gold:#ffc857; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#1a1538; --paper:#272058; --ink:#f6f1ff; --muted:#bdb2e3; --gold:#ffc857; color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"Nunito",sans-serif; text-align:center; padding-block:40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .box { display:grid; gap:16px; justify-items:center; max-width:460px; }
  img { height:240px; width:auto; max-width:100%; }
  h1 { font-family:"Fredoka",sans-serif; font-weight:700; font-size:2.2rem; margin:0; }
  p { color:var(--muted); margin:0; }
  a.btn { font-family:"Fredoka",sans-serif; font-weight:600; text-decoration:none; background:linear-gradient(180deg,#ffe08a,var(--sun)); color:#4a3300; padding:14px 24px; border-radius:999px; box-shadow:0 6px 0 #e3a92c; }
</style>
<div class="box">
  <img src="/assets/pip-sit.webp" alt="Pip">
  <h1>Oops, Pip got lost!</h1>

  <a class="btn" href="/">Back home</a>
</div>
