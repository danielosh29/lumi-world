name: Update subscriber count
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch count
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/update_subs.py
      - name: Commit if changed
        run: |
          git config user.name "lumi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/subs.json
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "Update subscriber count" && git push)
