name: Test beacon
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .yt/beacon-test.py
      - run: |
          git config user.name "lumi-bot"; git config user.email "actions@users.noreply.github.com"
          git add .yt/beacon-result.json; git commit -m "Beacon test result" && git push
